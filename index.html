<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Varuna Fahrwasser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Source+Sans+3:wght@400;600&family=Zilla+Slab:wght@600;700&display=swap">

<style>
:root {
  --bg: #E6ECEF;
  --panel: #FBFCFD;
  --panel-2: #F1F5F7;
  --ink: #12222E;
  --ink-2: #4B606F;
  --ink-3: #7D909C;
  --line: #CDD8DF;
  --line-soft: #DFE7EC;
  --accent: #1C6B74;
  --ladung: #6A3D9A;
  --ladung-soft: #EFE8F7;
  --signal: #B4641F;
  --signal-soft: #F3E2D2;
  --calm: #2F6E93;
  --calm-soft: #DCE7EF;
  --bar: #4E87A8;
  --bar-top: #2B5A78;
  --shadow: 0 1px 2px rgba(18,34,46,.06), 0 8px 24px -18px rgba(18,34,46,.5);

  --f-display: "Zilla Slab", Georgia, "Times New Roman", serif;
  --f-body: "Source Sans 3", -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #08141B;
    --panel: #0F212B;
    --panel-2: #142A36;
    --ink: #DCE8EE;
    --ink-2: #9BB0BC;
    --ink-3: #6B8190;
    --line: #213A48;
    --line-soft: #1A2F3B;
    --accent: #4FA6A8;
    --ladung: #B99BE6;
    --ladung-soft: #2A2238;
    --signal: #DE9354;
    --signal-soft: #33241A;
    --calm: #7BAACB;
    --calm-soft: #172B37;
    --bar: #4E87A8;
    --bar-top: #7FB4D2;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 28px -20px rgba(0,0,0,.9);
  }
}

:root[data-theme="dark"] {
  --bg: #08141B;
  --panel: #0F212B;
  --panel-2: #142A36;
  --ink: #DCE8EE;
  --ink-2: #9BB0BC;
  --ink-3: #6B8190;
  --line: #213A48;
  --line-soft: #1A2F3B;
  --accent: #4FA6A8;
  --ladung: #B99BE6;
  --ladung-soft: #2A2238;
  --signal: #DE9354;
  --signal-soft: #33241A;
  --calm: #7BAACB;
  --calm-soft: #172B37;
  --bar: #4E87A8;
  --bar-top: #7FB4D2;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 28px -20px rgba(0,0,0,.9);
}

* { box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.wrap {
  max-width: 920px;
  margin: 0 auto;
  padding-inline: 20px;
  padding-block: 40px 56px;
  display: flex;
  flex-direction: column;
  gap: 28px;
}

/* ---- header ---- */
.eyebrow {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin: 0 0 10px;
}
h1 {
  font-family: var(--f-display);
  font-weight: 700;
  font-size: clamp(30px, 6vw, 42px);
  line-height: 1.05;
  letter-spacing: -.01em;
  margin: 0;
  text-wrap: balance;
}
.standfirst {
  margin: 10px 0 0;
  color: var(--ink-2);
  max-width: 62ch;
}

/* ---- verdict: engster Pegel ---- */
.verdict {
  padding: 16px 22px 18px;
  border-radius: 3px;
  background: var(--calm-soft);
  border-left: 4px solid var(--calm);
}
.verdict-zeit {
  margin: 0 0 10px;
  font-family: var(--f-mono);
  font-size: 12px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--ink-2);
}
.verdict-zeit b { color: var(--ink); font-weight: 600; }
.verdict-zeile {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 10px 36px;
}
.verdict-feld { display: flex; flex-direction: column; gap: 2px; }
.verdict-feld-name { flex: 1 1 auto; min-width: 140px; }
.verdict-label {
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.verdict-name {
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 26px;
  line-height: 1.15;
}
.verdict-zahl {
  font-family: var(--f-mono);
  font-variant-numeric: tabular-nums;
  font-size: 30px;
  font-weight: 600;
  line-height: 1.1;
  white-space: nowrap;
}
.verdict-zahl small {
  font-size: 13px;
  font-weight: 400;
  color: var(--ink-3);
  margin-left: 3px;
}
.v-pegel { color: var(--ink); }
.v-tief { color: var(--accent); }
.v-ladung { color: var(--ladung); }

/* ---- panels ---- */
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 3px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.panel-head {
  display: flex;
  align-items: baseline;
  gap: 12px;
  flex-wrap: wrap;
  padding: 18px 22px 14px;
  border-bottom: 1px solid var(--line-soft);
}
.panel-head h3 {
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 19px;
  margin: 0;
  letter-spacing: .005em;
}
.panel-head .note:empty { display: none; }
.panel-head .note {
  font-size: 13px;
  color: var(--ink-3);
  margin: 0;
  flex-basis: 100%;
  padding-top: 2px;
}

.badge {
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: .1em;
  text-transform: uppercase;
  padding: 3px 7px;
  border-radius: 2px;
  border: 1px solid currentColor;
  flex: none;
}
.badge.live { color: var(--accent); }

.umschalter {
  margin-left: auto;
  display: inline-flex;
  border: 1px solid var(--accent);
  border-radius: 3px;
  overflow: hidden;
}
.umschalter button {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: .06em;
  padding: 6px 12px;
  border: 0;
  background: transparent;
  color: var(--accent);
  cursor: pointer;
  white-space: nowrap;
  transition: background .12s ease, color .12s ease;
}
.umschalter button + button { border-left: 1px solid var(--accent); }
.umschalter button[aria-pressed="true"] { background: var(--accent); color: var(--panel); }
.umschalter button:hover:not(:disabled):not([aria-pressed="true"]) { background: var(--calm-soft); }
.umschalter button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.umschalter button:disabled { opacity: .55; cursor: default; }
.badge.sample { color: var(--signal); background: var(--signal-soft); border-color: transparent; }

/* ---- gauge rows ---- */
.gauge {
  display: grid;
  grid-template-columns: 1fr 120px 140px;
  gap: 4px 20px;
  align-items: baseline;
  padding: 16px 22px;
  border-bottom: 1px solid var(--line-soft);
}
.gauge:last-child { border-bottom: 0; }
.gauge.engster {
  background: var(--panel-2);
  box-shadow: inset 4px 0 0 var(--accent);
}
.chip.engster-chip { background: var(--accent); color: var(--panel); }
.gauge-name {
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 18px;
}
.gauge-name span {
  font-family: var(--f-body);
  font-weight: 400;
  font-size: 13px;
  color: var(--ink-3);
  margin-left: 8px;
}
.gauge-meta {
  grid-row: 2;
  grid-column: 1;
  align-self: start;
  font-size: 13px;
  color: var(--ink-2);
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.gauge-name { grid-row: 1; grid-column: 1; }
.gauge-val {
  grid-row: 1;
  grid-column: 2;
  text-align: right;
  font-family: var(--f-mono);
  font-variant-numeric: tabular-nums;
  font-size: 36px;
  font-weight: 600;
  line-height: 1.1;
  white-space: nowrap;
}
.gauge-val small {
  font-size: 13px;
  font-weight: 400;
  color: var(--ink-3);
  margin-left: 3px;
}

/* ---- Spaltenköpfe über den Pegelzeilen ---- */
.gauge-head {
  display: grid;
  grid-template-columns: 1fr 120px 140px;
  gap: 20px;
  padding: 10px 22px 8px;
  border-bottom: 1px solid var(--line-soft);
  background: var(--panel-2);
}
.gauge-head span {
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink-3);
  text-align: right;
}
.gauge-head span:first-child { text-align: left; }
.gauge-head .kopf-pegel { color: var(--ink); font-weight: 600; }
.gauge-head .kopf-ablade { color: var(--accent); font-weight: 600; }
.gauge-head .kopf-ladung { color: var(--ladung); font-weight: 600; }
.gauge-unter {
  grid-row: 2;
  grid-column: 3;
  align-self: start;
  text-align: right;
}
.gauge-ab-zahl {
  grid-row: 1;
  grid-column: 3;
  text-align: right;
  font-family: var(--f-mono);
  font-variant-numeric: tabular-nums;
  font-size: 36px;
  font-weight: 600;
  line-height: 1.1;
  white-space: nowrap;
  color: var(--accent);
}
.gauge-t {
  margin-top: 5px;
  font-family: var(--f-mono);
  font-variant-numeric: tabular-nums;
  font-size: 21px;
  font-weight: 600;
  line-height: 1.1;
  white-space: nowrap;
  color: var(--ladung);
}
.gauge-t small {
  font-size: 13px;
  font-weight: 400;
  color: var(--ink-3);
  margin-left: 3px;
}
.gauge-voll {
  font-family: var(--f-mono);
  font-size: 11px;
  color: var(--accent);
  margin-top: 3px;
  white-space: nowrap;
}
.gauge-ab-zahl small {
  font-size: 13px;
  font-weight: 400;
  color: var(--ink-3);
  margin-left: 3px;
}
.chip {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: .04em;
  padding: 2px 7px;
  border-radius: 2px;
  background: var(--panel-2);
  color: var(--ink-2);
  white-space: nowrap;
}
.chip.falling { background: var(--calm-soft); color: var(--calm); }
.chip.rising  { background: var(--signal-soft); color: var(--signal); }
.ts { font-family: var(--f-mono); font-size: 12px; color: var(--ink-3); }
.stale { color: var(--signal); }

/* ---- rain ---- */
.area {
  padding: 18px 22px 14px;
  border-bottom: 1px solid var(--line-soft);
}
.area:last-of-type { border-bottom: 0; }
.area-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 12px;
}
.area-name { font-weight: 600; font-size: 15px; }
.area-sum {
  font-family: var(--f-mono);
  font-variant-numeric: tabular-nums;
  font-size: 13px;
  color: var(--ink-2);
}
.bars {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 2px;
  align-items: end;
  height: 72px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 0;
}
.bar-cell {
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: stretch;
  height: 100%;
  position: relative;
  cursor: default;
}
.bar {
  background: var(--bar);
  border-radius: 4px 4px 0 0;
  min-height: 2px;
  transition: background .12s ease;
}
.bar-cell:hover .bar, .bar-cell:focus-visible .bar { background: var(--bar-top); }
.bar-cell:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bar-peak {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  text-align: center;
  font-family: var(--f-mono);
  font-size: 11px;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}
.days {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 2px;
  margin-top: 6px;
}
.day {
  text-align: center;
  font-family: var(--f-mono);
  font-size: 10px;
  color: var(--ink-3);
  letter-spacing: .02em;
}
.day.today { color: var(--accent); font-weight: 600; }

/* ---- Diesel ---- */
.diesel-body {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 20px 28px;
  align-items: center;
  padding: 20px 22px 18px;
}
.diesel-zahl {
  font-family: var(--f-mono);
  font-variant-numeric: tabular-nums;
  font-size: 38px;
  font-weight: 600;
  line-height: 1;
  white-space: nowrap;
}
.diesel-zahl small {
  font-size: 13px;
  font-weight: 400;
  color: var(--ink-3);
  margin-left: 5px;
}
.diesel-trend {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}
.diesel-trend .chip { font-size: 12px; padding: 3px 8px; }
.diesel-trend .chip.leise { opacity: .8; }
.diesel-spanne {
  font-family: var(--f-mono);
  font-size: 12px;
  color: var(--ink-2);
  margin-top: 7px;
  font-variant-numeric: tabular-nums;
}
.spark { width: 100%; height: 76px; display: block; }
.spark-cap {
  font-family: var(--f-mono);
  font-size: 11px;
  color: var(--ink-3);
  margin-top: 4px;
  display: flex;
  justify-content: space-between;
}
.diesel-fuss {
  grid-column: 1 / -1;
  border-top: 1px solid var(--line-soft);
  padding-top: 12px;
  font-size: 13px;
  color: var(--ink-2);
  line-height: 1.55;
}
.diesel-fuss code {
  font-family: var(--f-mono);
  font-size: 12px;
  color: var(--ink-3);
}

#tip {
  position: fixed;
  z-index: 40;
  pointer-events: none;
  background: var(--ink);
  color: var(--panel);
  font-family: var(--f-mono);
  font-size: 12px;
  padding: 5px 9px;
  border-radius: 3px;
  transform: translate(-50%, -140%);
  white-space: nowrap;
  opacity: 0;
  transition: opacity .1s ease;
}
#tip.on { opacity: 1; }

/* ---- footer ---- */
footer {
  font-size: 13px;
  color: var(--ink-3);
  border-top: 1px solid var(--line);
  padding-top: 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
footer a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
footer strong { color: var(--ink-2); font-weight: 600; }
.sample-key {
  display: inline-block;
  width: 9px; height: 9px;
  background: var(--signal);
  border-radius: 2px;
  margin-right: 5px;
  vertical-align: baseline;
}

@media (max-width: 560px) {
  .diesel-body { grid-template-columns: 1fr; padding-inline: 16px; }
  .diesel-zahl { font-size: 32px; }
  .gauge, .gauge-head { grid-template-columns: 1fr 70px 92px; gap: 4px 10px; }
  .gauge-name { grid-row: 1 / span 2; align-self: start; }
  .verdict { padding: 14px 16px 16px; }
  .verdict-zeile { gap: 8px 20px; }
  .verdict-feld-name { flex-basis: 100%; }
  .verdict-name { font-size: 22px; }
  .verdict-zahl { font-size: 24px; }
  .gauge-val, .gauge-ab-zahl { grid-row: 1; }
  .gauge-unter { grid-row: 2; }
  .gauge-meta { grid-row: 3; grid-column: 1 / -1; margin-top: 6px; }
  .gauge-name span { display: block; margin-left: 0; font-size: 12px; }
  .gauge-val { font-size: 24px; }
  .gauge-ab-zahl { font-size: 24px; }
  .gauge-t { font-size: 16px; margin-top: 3px; }
  .gauge-val small, .gauge-ab-zahl small, .gauge-t small { font-size: 10px; margin-left: 1px; }
  .gauge-name { font-size: 16px; }
  .gauge-name span { display: block; margin-left: 0; }
  .area, .panel-head, .gauge, .gauge-head { padding-inline: 16px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>

</head>
<body>

<div class="wrap">

  <header>
    <p class="eyebrow">GMS Varuna · BSR 26031 · RenShip GmbH</p>
    <h1>Fahrwasser &amp; Einzugsgebiet</h1>
  </header>

  <section class="verdict" id="verdict" aria-live="polite">
    <p class="verdict-zeit" id="verdict-zeit">Lade&hellip;</p>
    <div class="verdict-zeile">
      <div class="verdict-feld verdict-feld-name">
        <span class="verdict-label">Engster Pegel</span>
        <b class="verdict-name" id="verdict-name">&ndash;</b>
      </div>
      <div class="verdict-feld">
        <span class="verdict-label">Pegel</span>
        <b class="verdict-zahl v-pegel" id="verdict-pegel">&ndash;</b>
      </div>
      <div class="verdict-feld">
        <span class="verdict-label" id="verdict-tief-label">Tiefgang</span>
        <b class="verdict-zahl v-tief" id="verdict-tief">&ndash;</b>
      </div>
      <div class="verdict-feld">
        <span class="verdict-label">Ladung</span>
        <b class="verdict-zahl v-ladung" id="verdict-t">&ndash;</b>
      </div>
    </div>
  </section>

  <section class="panel" aria-labelledby="h-pegel">
    <div class="panel-head">
      <h3 id="h-pegel">Pegel</h3>
      <span class="badge live" id="pegel-badge">Live</span>
      <div class="umschalter" role="group" aria-label="Welche Pegelwerte anzeigen">
        <button type="button" id="btn-5uhr" aria-pressed="false">5-Uhr-Wert</button>
        <button type="button" id="btn-aktuell" aria-pressed="true">Aktuell</button>
      </div>
      <p class="note" id="pegel-note"></p>
    </div>
    <div class="gauge-head" aria-hidden="true">
      <span>Pegelstelle</span><span class="kopf-pegel">Pegel</span><span><b class="kopf-ablade">Abladetiefe</b> / <b class="kopf-ladung">Ladung</b></span>
    </div>
    <div id="gauges"></div>
  </section>

  <section class="panel" aria-labelledby="h-regen">
    <div class="panel-head">
      <h3 id="h-regen">Regen im Einzugsgebiet</h3>
      <span class="badge sample" id="regen-badge">Beispieldaten</span>
    </div>
    <div id="rain"></div>
  </section>

  <section class="panel" aria-labelledby="h-diesel">
    <div class="panel-head">
      <h3 id="h-diesel">Diesel, gesch&auml;tzt</h3>
      <span class="badge sample" id="diesel-badge">Sch&auml;tzung</span>
      <p class="note" id="diesel-note"></p>
    </div>
    <div id="diesel"></div>
  </section>

  <footer>
    <div id="foot-updated"></div>
  </footer>

</div>

<div id="tip" role="status"></div>

  };

  /* Abladetiefe = Pegelstand plus fester Zuschlag je Pegel, in cm.
     Maxau minus 160, Mannheim plus 70, Worms plus 160, Mainz plus 30,
     Oestrich plus 100, Kaub plus 120. */
  var OFFSET_CM = { MAXAU: -160, MANNHEIM: 70, WORMS: 160, MAINZ: 30, OESTRICH: 100, KAUB: 120 };

  function abladungCm(g) {
    if (g == null || g.value == null) return null;
    var off = (typeof g.offsetCm === "number") ? g.offsetCm : OFFSET_CM[g.id];
    if (typeof off !== "number") return null;
    return g.value + off;
  }

  function fmtM(cm) {
    return (cm / 100).toFixed(2).replace(".", ",");
  }

  /* Eichskala aus Eichschein MAD 1777 (GMS Varuna, ex Toketi II).
     Stützstellen je 10 cm Eintauchung, Tragfähigkeit in Tonnen Süßwasser.
     Zwischen zwei Stützstellen wächst die Verdrängung linear — die
     Zwischenwerte treffen die Tabelle des Eichscheins deshalb exakt.
     Leerebene bei 89,3 cm, größte Eintauchung 330 cm = 2143,033 t. */
  var LEEREBENE_CM = 89.3;
  var GROESSTE_EINTAUCHUNG_CM = 330;   // Eichschein: tiefer geht die Varuna nicht
  var EICHSKALA = [
    [90, 5.983], [100, 91.573], [110, 177.413], [120, 263.543], [130, 349.953],
    [140, 436.663], [150, 523.693], [160, 611.033], [170, 698.693], [180, 786.653],
    [190, 874.883], [200, 963.333], [210, 1052.113], [220, 1141.223], [230, 1230.663],
    [240, 1320.433], [250, 1410.533], [260, 1500.963], [270, 1591.723], [280, 1682.813],
    [290, 1774.233], [300, 1865.983], [310, 1958.033], [320, 2050.383], [330, 2143.033]
  ];

  function tonnen(cm) {
    if (cm == null || cm <= LEEREBENE_CM) return 0;
    if (cm >= 330) return EICHSKALA[EICHSKALA.length - 1][1];
    if (cm <= 90) {
      return 5.983 * (cm - LEEREBENE_CM) / (90 - LEEREBENE_CM);
    }
    for (var i = 1; i < EICHSKALA.length; i++) {
      if (cm <= EICHSKALA[i][0]) {
        var a = EICHSKALA[i - 1], b = EICHSKALA[i];
        return a[1] + (b[1] - a[1]) * (cm - a[0]) / (b[0] - a[0]);
      }
    }
    return null;
  }

  function fmtT(t) {
    return Math.round(t).toLocaleString("de-DE");
  }

  function offsetLabel(g) {
    var off = (typeof g.offsetCm === "number") ? g.offsetCm : OFFSET_CM[g.id];
    if (typeof off !== "number") return "";
    return (off < 0 ? "− " : "+ ") + Math.abs(off) + " cm";
  }

  var STATE_LABEL = { low: "niedrig", normal: "mittel", high: "hoch" };
  var TREND_LABEL = { falling: "fallend", rising: "steigend", steady: "gleichbleibend", unknown: "Trend offen" };

  var DAYS = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];

  function fmtDateTime(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return "—";
    return DAYS[d.getDay()] + " " + String(d.getDate()).padStart(2, "0") + "." +
      String(d.getMonth() + 1).padStart(2, "0") + ". " +
      String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0") + " Uhr";
  }

  function hoursSince(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return null;
    return (Date.now() - d.getTime()) / 3600000;
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  /* ---------- gauges ---------- */

  /* Oestrich und Kaub liegen unterhalb von Mainz und werden auf den meisten
     Fahrten nicht passiert. Sie stehen in der Tabelle, zählen aber nicht für
     den engsten Wert. */
  var NICHT_IN_KOPFZEILE = { OESTRICH: true, KAUB: true };

  function engsterPegel(items) {
    var id = null, best = Infinity;
    items.forEach(function (g) {
      if (NICHT_IN_KOPFZEILE[g.id]) return;
      var c = abladungCm(g);
      if (c != null && c < best) { best = c; id = g.id; }
    });
    return id;
  }

  function renderGauges(data, istLive) {
    var host = document.getElementById("gauges");
    host.textContent = "";
    var items = (data && data.items) || [];
    var anySample = false;
    var engsterId = engsterPegel(items);

    items.forEach(function (g) {
      if (g.placeholder) anySample = true;
      var row = el("div", "gauge" + (g.id === engsterId ? " engster" : ""));

      var name = el("div", "gauge-name", g.name);
      var riv = el("span", null, g.river);
      name.appendChild(riv);
      row.appendChild(name);

      var val = el("div", "gauge-val");
      val.appendChild(document.createTextNode(g.value == null ? "—" : String(g.value)));
      val.appendChild(el("small", null, "cm"));
      row.appendChild(val);

      var abCm = abladungCm(g);
      var zahl = el("div", "gauge-ab-zahl");
      if (abCm == null) {
        zahl.textContent = "—";
      } else {
        zahl.appendChild(document.createTextNode(fmtM(Math.min(abCm, GROESSTE_EINTAUCHUNG_CM))));
        zahl.appendChild(el("small", null, "m"));
      }
      zahl.title = "Pegel " + g.value + " cm " + offsetLabel(g);
      row.appendChild(zahl);
      var unter = el("div", "gauge-unter");

      var t = abCm == null ? null : tonnen(abCm);
      var tCell = el("div", "gauge-t");
      if (t == null) {
        tCell.textContent = "—";
      } else {
        tCell.appendChild(document.createTextNode(fmtT(t)));
        tCell.appendChild(el("small", null, "t"));
      }
      unter.appendChild(tCell);

      if (abCm != null && abCm >= GROESSTE_EINTAUCHUNG_CM) {
        unter.appendChild(el("div", "gauge-voll", "voll abgeladen"));
      }
      row.appendChild(unter);

      var meta = el("div", "gauge-meta");
      if (g.id === engsterId) meta.appendChild(el("span", "chip engster-chip", "engster Wert"));

      var stateChip = el("span", "chip", STATE_LABEL[g.state] || "Zustand offen");
      meta.appendChild(stateChip);

      var trendChip = el("span", "chip " + (g.trend === "falling" ? "falling" : g.trend === "rising" ? "rising" : ""),
        TREND_LABEL[g.trend] || TREND_LABEL.unknown);
      meta.appendChild(trendChip);

      var h = hoursSince(g.ts);
      var ts = el("span", "ts" + (h != null && h > 27 ? " stale" : ""), "Stand " + fmtDateTime(g.ts));
      meta.appendChild(ts);

      if (g.placeholder) meta.appendChild(el("span", "badge sample", "Beispiel"));
      if (g.trendNote) {
        var note = el("span", "ts", "· " + g.trendNote);
        meta.appendChild(note);
      }

      row.appendChild(meta);
      host.appendChild(row);
    });

    var badge = document.getElementById("pegel-badge");
    if (anySample) { badge.className = "badge sample"; badge.textContent = "Teils Beispieldaten"; }
    else if (istLive) { badge.className = "badge live"; badge.textContent = "Momentanwerte"; }
    else { badge.className = "badge live"; badge.textContent = "Gemessen"; }

    document.getElementById("pegel-note").textContent =
      "Abladetiefe = Pegel " +
      items.map(function (g) { return g.name + " " + offsetLabel(g); }).join(" · ");

    renderVerdict(items, istLive);
  }

  function wertSetzen(id, text, einheit) {
    var e = document.getElementById(id);
    e.textContent = text;
    if (einheit) e.appendChild(el("small", null, einheit));
  }

  /* Kopfbox: nur der engste Ladepegel (ohne Oestrich und Kaub) und
     von wann die angezeigten Werte sind. */
  function renderVerdict(items, istLive) {
    var zeit = document.getElementById("verdict-zeit");
    var engId = engsterPegel(items);
    var g = null;
    items.forEach(function (x) { if (x.id === engId) g = x; });

    zeit.textContent = "";
    zeit.appendChild(el("b", null, istLive ? "Aktuell" : "5-Uhr-Wert"));
    zeit.appendChild(document.createTextNode(g && g.ts ? " · " + fmtDateTime(g.ts) : ""));

    if (!g) {
      ["verdict-name", "verdict-pegel", "verdict-tief", "verdict-t"].forEach(function (id) {
        wertSetzen(id, "–");
      });
      return;
    }
    var cm = abladungCm(g);
    var voll = cm >= GROESSTE_EINTAUCHUNG_CM;
    wertSetzen("verdict-name", g.name);
    wertSetzen("verdict-pegel", String(g.value), "cm");
    wertSetzen("verdict-tief", fmtM(Math.min(cm, GROESSTE_EINTAUCHUNG_CM)), "m");
    wertSetzen("verdict-t", fmtT(tonnen(cm)), "t");
    document.getElementById("verdict-tief-label").textContent = voll ? "Tiefgang · voll" : "Tiefgang";
  }

  /* ---------- rain ---------- */

  function renderRain(data) {
    var host = document.getElementById("rain");
    host.textContent = "";
    var areas = (data && data.areas) || [];

    /* mm[0] ist der Tag, an dem die Prognose geholt wurde. Ist der Stand
       älter als heute, werden die vergangenen Tage weggelassen, damit die
       Balken immer bei heute beginnen. */
    var heute0 = new Date(); heute0.setHours(0, 0, 0, 0);
    var versatz = 0;
    if (data && data.updatedAt) {
      var b = new Date(data.updatedAt);
      var basis0 = new Date(b.getFullYear(), b.getMonth(), b.getDate());
      versatz = Math.max(0, Math.round((heute0 - basis0) / 86400000));
    }
    areas = areas.map(function (a) {
      return { name: a.name, mm: (a.mm || []).slice(versatz) };
    });
    var anzahlTage = Math.max(0, 7 - versatz);

    var max = 1;
    areas.forEach(function (a) {
      (a.mm || []).forEach(function (v) { if (v > max) max = v; });
    });

    var labels = [];
    for (var i = 0; i < anzahlTage; i++) {
      var d = new Date(heute0.getFullYear(), heute0.getMonth(), heute0.getDate() + i);
      labels.push({
        short: DAYS[d.getDay()],
        full: DAYS[d.getDay()] + " " + String(d.getDate()).padStart(2, "0") + "." + String(d.getMonth() + 1).padStart(2, "0") + ".",
        today: i === 0
      });
    }

    areas.forEach(function (a) {
      var wrapEl = el("div", "area");

      var head = el("div", "area-head");
      head.appendChild(el("div", "area-name", a.name));
      var sum = (a.mm || []).reduce(function (s, v) { return s + v; }, 0);
      head.appendChild(el("div", "area-sum", labels.length + " Tage: " + Math.round(sum) + " mm"));
      wrapEl.appendChild(head);

      var peakIdx = 0;
      (a.mm || []).forEach(function (v, i) { if (v > (a.mm[peakIdx] || 0)) peakIdx = i; });

      var bars = el("div", "bars");
      bars.setAttribute("role", "img");
      bars.setAttribute("aria-label", a.name + ": Niederschlag " + (a.mm || []).map(function (v, i) {
        return labels[i].full + " " + v + " mm";
      }).join(", "));

      (a.mm || []).forEach(function (v, i) {
        var cell = el("div", "bar-cell");
        cell.tabIndex = 0;
        var bar = el("div", "bar");
        bar.style.height = Math.max(2, Math.round((v / max) * 56)) + "px";
        if (i === peakIdx && v > 0) {
          var lab = el("div", "bar-peak", v + " mm");
          cell.appendChild(lab);
        }
        cell.appendChild(bar);
        cell._tip = labels[i].full + "  " + v + " mm";
        bars.appendChild(cell);
      });
      wrapEl.appendChild(bars);

      var days = el("div", "days");
      labels.forEach(function (l) {
        days.appendChild(el("div", "day" + (l.today ? " today" : ""), l.short));
      });
      wrapEl.appendChild(days);

      host.appendChild(wrapEl);
    });

    var badge = document.getElementById("regen-badge");
    if (data && data.placeholder === false) {
      badge.className = "badge live";
      badge.textContent = "Prognose";
    } else {
      badge.className = "badge sample";
      badge.textContent = "Beispieldaten";
    }
  }

  /* ---------- Momentanwerte auf Knopfdruck ---------- */

  var PEGELONLINE = "https://www.pegelonline.wsv.de/webservices/rest-api/v2/stations/";
  var TAGESSTAND = null;   // zuletzt geladener 5-Uhr-Stand
  var LIVE = false;

  function knoepfeSetzen() {
    document.getElementById("btn-5uhr").setAttribute("aria-pressed", LIVE ? "false" : "true");
    document.getElementById("btn-aktuell").setAttribute("aria-pressed", LIVE ? "true" : "false");
  }

  function fuenfUhrZeigen() {
    LIVE = false;
    renderGauges(TAGESSTAND, false);
    knoepfeSetzen();
  }

  /* Holt bei jedem Druck frisch – auch wenn schon Momentanwerte angezeigt werden. */
  var ABRUF_LAEUFT = false;
  async function aktuellAbrufen() {
    var btn = document.getElementById("btn-aktuell");
    if (!TAGESSTAND || !TAGESSTAND.items || ABRUF_LAEUFT) return;

    ABRUF_LAEUFT = true;
    btn.disabled = true;
    btn.textContent = "Wird geholt …";

    try {
      var items = await Promise.all(TAGESSTAND.items.map(async function (g) {
        var r = await fetch(PEGELONLINE + encodeURIComponent(g.id) + "/W/currentmeasurement.json",
                            { cache: "no-store" });
        if (!r.ok) throw new Error(g.name + ": HTTP " + r.status);
        var m = await r.json();
        var wert = Math.round(m.value);
        var diff = (typeof g.value === "number") ? wert - g.value : null;
        return {
          id: g.id, name: g.name, river: g.river,
          value: wert,
          ts: m.timestamp,
          state: m.stateMnwMhw || g.state,
          trend: diff == null ? "unknown" : diff > 0 ? "rising" : diff < 0 ? "falling" : "steady",
          trendNote: diff == null ? "Momentanwert"
            : "Momentanwert, " + (diff > 0 ? "+" : "") + diff + " cm gegenüber 5 Uhr",
          placeholder: false
        };
      }));

      LIVE = true;
      renderGauges({ updatedAt: new Date().toISOString(), placeholder: false, items: items }, true);
    } catch (e) {
      console.error("Momentanabruf fehlgeschlagen:", e);
      document.getElementById("pegel-note").textContent =
        "Abruf fehlgeschlagen – PEGELONLINE antwortet gerade nicht. Angezeigt bleibt der 5-Uhr-Stand.";
    } finally {
      ABRUF_LAEUFT = false;
      btn.disabled = false;
      btn.textContent = "Aktuell";
      knoepfeSetzen();
    }
  }

  document.getElementById("btn-5uhr").addEventListener("click", fuenfUhrZeigen);
  document.getElementById("btn-aktuell").addEventListener("click", aktuellAbrufen);

  /* ---------- diesel ---------- */

  function euro(v) {
    return v.toFixed(2).replace(".", ",");
  }

  function sparkline(punkte) {
    var w = 560, h = 76, pad = 8;
    var werte = punkte.map(function (p) { return p.v; });
    var min = Math.min.apply(null, werte), max = Math.max.apply(null, werte);
    if (max - min < 1) { max = min + 1; }
    var n = punkte.length;
    var x = function (i) { return pad + i * (w - 2 * pad) / Math.max(1, n - 1); };
    var y = function (v) { return pad + (max - v) / (max - min) * (h - 2 * pad); };

    var linie = punkte.map(function (p, i) { return (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.v).toFixed(1); }).join(" ");
    var flaeche = linie + " L" + x(n - 1).toFixed(1) + " " + (h - pad) + " L" + x(0).toFixed(1) + " " + (h - pad) + " Z";

    var svg = '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" role="img" ' +
      'aria-label="Verlauf der geschätzten Preise, ' + euro(min) + ' bis ' + euro(max) + ' Euro je 100 Liter">' +
      '<path d="' + flaeche + '" fill="var(--calm-soft)"></path>' +
      '<path d="' + linie + '" fill="none" stroke="var(--calm)" stroke-width="2" ' +
      'stroke-linejoin="round" stroke-linecap="round"></path>' +
      '<circle cx="' + x(n - 1).toFixed(1) + '" cy="' + y(werte[n - 1]).toFixed(1) + '" r="4" ' +
      'fill="var(--calm)" stroke="var(--panel)" stroke-width="2"></circle>' +
      '</svg>';
    return { svg: svg, min: min, max: max };
  }

  function dieselVeraenderung(d, tage) {
    var h = d.history;
    if (!h || h.length < 2 || d.estimate == null) return null;
    var letzter = new Date(h[h.length - 1].d + "T12:00:00");
    var stichtag = new Date(letzter.getTime() - tage * 86400000).toISOString().slice(0, 10);
    var basis = null;
    for (var i = h.length - 1; i >= 0; i--) {
      if (h[i].d <= stichtag) { basis = h[i]; break; }
    }
    if (!basis) return null;           // Verlauf reicht nicht so weit zurück
    return Math.round((d.estimate - basis.v) * 100) / 100;
  }

  function renderDiesel(d) {
    var host = document.getElementById("diesel");
    var badge = document.getElementById("diesel-badge");
    var note = document.getElementById("diesel-note");
    host.textContent = "";

    if (!d || d.estimate == null) {
      note.textContent = "Marktdaten konnten nicht geladen werden.";
      host.appendChild(el("div", "diesel-fuss", "Kein Marktstand verfügbar."));
      return;
    }

    note.textContent = "";
    badge.className = "badge sample";
    badge.textContent = "Schätzung";

    var body = el("div", "diesel-body");

    var links = el("div");
    var zahl = el("div", "diesel-zahl");
    zahl.appendChild(document.createTextNode(euro(d.estimate)));
    zahl.appendChild(el("small", null, "€/100 L"));
    links.appendChild(zahl);
    links.appendChild(el("div", "diesel-spanne", "wahrscheinlich " + d.low + " bis " + d.high + " €"));

    /* Richtung: heutiger Schätzwert gegen den Wert vor 7 und vor 30 Tagen
       (jeweils der letzte Handelstag an oder vor dem Stichtag). */
    var trends = [7, 30].map(function (tage) {
      return { tage: tage, diff: dieselVeraenderung(d, tage) };
    }).filter(function (t) { return t.diff != null; });

    if (trends.length) {
      var box = el("div", "diesel-trend");
      trends.forEach(function (t, i) {
        var richtung = t.diff > 0.5 ? "rising" : t.diff < -0.5 ? "falling" : "";
        var pfeil = t.diff > 0.5 ? "↑ " : t.diff < -0.5 ? "↓ " : "→ ";
        var text = pfeil + (t.diff > 0 ? "+" : t.diff < 0 ? "−" : "±") +
                   euro(Math.abs(t.diff)) + " € in " + t.tage + " Tagen";
        box.appendChild(el("span", "chip " + richtung + (i ? " leise" : ""), text));
      });
      links.appendChild(box);
    }
    body.appendChild(links);

    var rechts = el("div");
    if (d.history && d.history.length > 2) {
      var sp = sparkline(d.history);
      var box = document.createElement("div");
      box.innerHTML = sp.svg;
      rechts.appendChild(box);
      var cap = el("div", "spark-cap");
      cap.appendChild(el("span", null, d.history[0].d.slice(8, 10) + "." + d.history[0].d.slice(5, 7) + "."));
      cap.appendChild(el("span", null, "Tief " + euro(sp.min) + " · Hoch " + euro(sp.max)));
      cap.appendChild(el("span", null, "heute"));
      rechts.appendChild(cap);
    }
    body.appendChild(rechts);


    host.appendChild(body);
  }

  /* ---------- tooltip ---------- */

  var tip = document.getElementById("tip");
  function showTip(e) {
    var cell = e.target.closest ? e.target.closest(".bar-cell") : null;
    if (!cell || !cell._tip) return;
    tip.textContent = cell._tip;
    var r = cell.getBoundingClientRect();
    tip.style.left = (r.left + r.width / 2) + "px";
    tip.style.top = r.top + "px";
    tip.classList.add("on");
  }
  function hideTip() { tip.classList.remove("on"); }
  document.addEventListener("mouseover", showTip);
  document.addEventListener("mouseout", hideTip);
  document.addEventListener("focusin", showTip);
  document.addEventListener("focusout", hideTip);

  /* ---------- footer ---------- */

  function renderFooter(gaugesUpdated, live) {
    var f = document.getElementById("foot-updated");
    f.textContent = (live ? "Zuletzt aktualisiert " : "Eingebauter Stand: ") +
      fmtDateTime(gaugesUpdated);
  }

  /* ---------- boot ---------- */

  TAGESSTAND = SNAPSHOT.gauges;
  renderGauges(TAGESSTAND, false);
  renderRain(SNAPSHOT.rain);
  renderDiesel(SNAPSHOT.diesel);
  renderFooter(SNAPSHOT.gauges.updatedAt, false);

  async function datenLaden() {
    try {
      var res = await fetch("daten.json?t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) return;
      var d = await res.json();
      if (d.gauges) {
        TAGESSTAND = d.gauges;
        if (!LIVE) renderGauges(TAGESSTAND, false);
        renderFooter(d.gauges.updatedAt, true);
      }
      if (d.rain) renderRain(d.rain);
      if (d.diesel) renderDiesel(d.diesel);
    } catch (e) {
      /* Der beim Veroeffentlichen eingebaute Stand bleibt stehen. */
    }
  }

  /* Beim Öffnen und Neuladen: Tagesdaten holen, dann gleich die
     Momentanwerte. Der 5-Uhr-Stand kommt nur auf Knopfdruck. */
  async function allesAktualisieren() {
    await datenLaden();
    await aktuellAbrufen();
  }
  allesAktualisieren();

  /* Wer die Seite offen lässt (Handy, Safari-Tab) und später wieder
     hinschaut, bekommt ebenfalls den frischen Stand. */
  var verstecktSeit = null;
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      verstecktSeit = Date.now();
    } else if (verstecktSeit && Date.now() - verstecktSeit > 60 * 1000) {
      verstecktSeit = null;
      allesAktualisieren();
    }
  });
  window.addEventListener("pageshow", function (e) {
    if (e.persisted) allesAktualisieren();
  });

})();
</script>

</body>
</html>
